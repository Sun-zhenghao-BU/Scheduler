[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduler-automation"
version = "0.1.0"
description = "Local automation workflow scaffold for spec, implementation, review, and release."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Zhenghao" }
]

[project.scripts]
scheduler-flow = "scheduler_automation.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
