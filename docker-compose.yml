services:
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: scheduler
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      SCHEDULER_PROJECT_ROOT: /workspace/project
      SCHEDULER_HOST_C_LABEL: ${HOST_C_LABEL:-Windows (C:)}
      SCHEDULER_HOST_D_LABEL: ${HOST_D_LABEL:-新加卷 (D:)}
      SCHEDULER_OPEN_ROOTS: project|当前项目|/workspace/project;c|${HOST_C_LABEL:-Windows (C:)}|/host/c;d|${HOST_D_LABEL:-新加卷 (D:)}|/host/d
    volumes:
      - scheduler-data:/root/.scheduler
      - ./tasks:/app/tasks
      - ${PROJECT_ROOT:-.}:/workspace/project
      - ${HOST_C_PATH:-C:/}:/host/c
      - ${HOST_D_PATH:-D:/}:/host/d
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  scheduler-data:
