services:
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: scheduler
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      SCHEDULER_PROJECT_ROOT: /workspace/project
      SCHEDULER_HOST_WORK_LABEL: ${HOST_WORK_PATH:-D:/Work}
      SCHEDULER_HOST_HOME_LABEL: ${HOST_HOME_PATH:-C:/Users/SZH}
      SCHEDULER_OPEN_ROOTS: project|当前项目|/workspace/project;work|${HOST_WORK_PATH:-D:/Work}|/host/work;home|${HOST_HOME_PATH:-C:/Users/SZH}|/host/home
    volumes:
      - scheduler-data:/root/.scheduler
      - ./tasks:/app/tasks
      - ${PROJECT_ROOT:-.}:/workspace/project
      - ${HOST_WORK_PATH:-D:/Work}:/host/work
      - ${HOST_HOME_PATH:-C:/Users/SZH}:/host/home
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  scheduler-data:
